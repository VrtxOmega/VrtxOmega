<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="850" height="60">
  <defs>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="5%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="scrollBox">
      <rect x="0" y="0" width="850" height="60"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="60" fill="#000000"/>
  <line x1="0" y1="0" x2="850" y2="0" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="0" y1="59" x2="850" y2="59" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.4"/>

  <text x="25" y="40" font-family="Georgia, serif" font-size="22" fill="#C9A84C" filter="url(#glow)" font-weight="bold">Ω</text>

  <line x1="50" y1="20" x2="50" y2="45" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.5"/>

  <g clip-path="url(#scrollBox)">
    <text font-family="Georgia, serif" font-size="15" fill="#C9A84C" fill-opacity="0.9" letter-spacing="2">
      BUILDING SOVEREIGN INTELLIGENCE INFRASTRUCTURE THAT PASSES DISCIPLINED ATTEMPTS TO FALSIFY IT
      <animateTransform attributeName="transform" type="translate"
        values="850,0;-2100,0" dur="18s" repeatCount="indefinite"/>
    </text>
  </g>

  <g clip-path="url(#scrollBox)">
    <text font-family="Georgia, serif" font-size="10" fill="#C9A84C" fill-opacity="0.5" letter-spacing="3">
      VERITAS · 32 REPOSITORIES · 10-GATE BUILD PIPELINE · CRYPTOGRAPHIC AUDIT LEDGER · SSWP ATTESTATION · SOVEREIGN AI
      <animateTransform attributeName="transform" type="translate"
        values="850,32;-2100,32" dur="24s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="800" y="40" font-family="Georgia, serif" font-size="18" fill="#C9A84C" fill-opacity="0.12" font-weight="bold">Ω
    <animate attributeName="fill-opacity" values="0.12;0.30;0.12" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>