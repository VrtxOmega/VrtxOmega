    <line x1="400" y1="240" x2="520" y2="127"/>
    <line x1="400" y1="240" x2="640" y2="190"/>
    <line x1="400" y1="240" x2="580" y2="360"/>
    <line x1="400" y1="240" x2="400" y2="410"/>
    <line x1="400" y1="240" x2="220" y2="360"/>
    <line x1="400" y1="240" x2="160" y2="190"/>
    <line x1="400" y1="240" x2="220" y2="127"/>
    <line x1="400" y1="240" x2="280" y2="127"/>
