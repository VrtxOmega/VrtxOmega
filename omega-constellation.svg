    <line x1="640" y1="190" x2="580" y2="360"/>
    <line x1="580" y1="360" x2="400" y2="410"/>
    <line x1="400" y1="410" x2="220" y2="360"/>
    <line x1="220" y1="360" x2="160" y2="190"/>
    <line x1="160" y1="190" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="400" y2="410"/>
    <line x1="160" y1="190" x2="640" y2="190"/>
    <line x1="220" y1="360" x2="580" y2="360"/>
