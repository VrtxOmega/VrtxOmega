  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- Header -->
  <text x="400" y="28" font-family="Georgia, serif" font-size="13" fill="#C9A84C" text-anchor="middle" letter-spacing="5" fill-opacity="0.7">Ω UNIVERSE CONSTELLATION</text>
  <line x1="280" y1="38" x2="520" y2="38" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Concentric orbit rings -->
  <g fill="none" stroke="#FFD700" stroke-width="0.25" stroke-opacity="0.12">
    <circle cx="400" cy="240" r="160"/>
    <circle cx="400" cy="240" r="110"/>
    <circle cx="400" cy="240" r="60"/>
  </g>

  <!-- Cross-links (subtle inner geometry) -->
