name: Ω Constellation Update

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'generate_constellation.py'
      - '.github/workflows/constellation-update.yml'

jobs:
  update-constellation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate constellation
        run: python3 generate_constellation.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check
        run: |
          if [[ -n "$(git status --porcelain omega-constellation.svg)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push updated constellation
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Ω VERITAS Constellation"
          git config user.email "omega@veritas.ai"
          git add omega-constellation.svg
          git commit -m "Ω Constellation: auto-regenerated [skip ci]"
          git push
