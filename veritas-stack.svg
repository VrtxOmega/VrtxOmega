<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="850" height="220" fill="#000000"/>
  <text x="40" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFD700" letter-spacing="3">
    TECH STACK
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
  <line x1="40" y1="48" x2="810" y2="48" stroke="#30363d" stroke-width="1"/>

  <!-- Left: Language Bars -->
  <g transform="translate(40, 75)">
    <text font-family="Georgia, serif" font-size="11" fill="#8b949e" letter-spacing="2">LANGUAGES</text>

    <!-- Python -->
    <text font-family="Georgia, serif" font-size="13" fill="#C9A84C" y="28">Python</text>
    <rect x="70" y="20" width="320" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="70" y="20" width="220" height="10" rx="5" fill="url(#goldBar)">
      <animate attributeName="width" values="0;220" dur="1.5s" begin="0.0s" fill="freeze"/>
    </rect>
    <text font-family="Georgia, serif" font-size="11" fill="#FFD700" x="400" y="29">62%</text>

    <!-- JavaScript -->
    <text font-family="Georgia, serif" font-size="13" fill="#C9A84C" y="56">JavaScript</text>
    <rect x="70" y="48" width="320" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="70" y="48" width="180" height="10" rx="5" fill="url(#goldBar)">
      <animate attributeName="width" values="0;180" dur="1.5s" begin="0.2s" fill="freeze"/>
    </rect>
    <text font-family="Georgia, serif" font-size="11" fill="#FFD700" x="400" y="57">32%</text>

    <!-- Kotlin -->
    <text font-family="Georgia, serif" font-size="13" fill="#C9A84C" y="84">Kotlin</text>
    <rect x="70" y="76" width="320" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="70" y="76" width="56" height="10" rx="5" fill="url(#goldBar)">
      <animate attributeName="width" values="0;56" dur="1.5s" begin="0.4s" fill="freeze"/>
    </rect>
    <text font-family="Georgia, serif" font-size="11" fill="#FFD700" x="400" y="85">6%</text>
  </g>

  <!-- Right: Tool Grid -->
  <g transform="translate(480, 75)">
    <text font-family="Georgia, serif" font-size="11" fill="#8b949e" letter-spacing="2">TOOLS &amp; FRAMEWORKS</text>

    <!-- Row 1 -->
    <g transform="translate(0, 28)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">Electron</text>
    </g>
    <g transform="translate(160, 28)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">MCP</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 56)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">FastAPI</text>
    </g>
    <g transform="translate(160, 56)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">E2EE</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 84)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">Solidity</text>
    </g>
    <g transform="translate(160, 84)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">Three.js</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 112)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">React Native</text>
    </g>
    <g transform="translate(160, 112)">
      <circle cx="10" cy="10" r="10" fill="#1a1a1a" stroke="#C9A84C" stroke-width="1"/>
      <text x="28" y="14" font-family="Georgia, serif" font-size="12" fill="#C9A84C">WebSocket</text>
    </g>
  </g>
</svg>
